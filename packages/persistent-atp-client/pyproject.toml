[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-atp-client"
version = "0.1.0"
description = "Transport-neutral typed client for the persistent-ATP receiver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persistent_atp_client = ["py.typed", "schemas/*.json"]
