        # Add inside the derived Omega proxy's server block. The proxy process
        # has DEEPSEEK_API_KEY; Omega's scrubbed agent process does not.
        location = /deepseek/chat/completions {
            proxy_pass https://api.deepseek.com/chat/completions;
            proxy_set_header Authorization "Bearer ${DEEPSEEK_API_KEY}";
            proxy_set_header Host api.deepseek.com;
            proxy_set_header Content-Type $content_type;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
