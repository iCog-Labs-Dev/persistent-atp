name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      ARTIFACT_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Apply artifact store schema
        run: uv run python -c "from artifacts.schema import apply_schema; apply_schema()"
        env:
          ARTIFACT_DB_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Test
        run: uv run pytest -q

  mork-native:
    # Builds the pinned MORK FFI and runs every test that needs the real
    # library, so native coverage can no longer silently skip in CI. The
    # provenance drift check runs inside the suite (mork/tests/test_provenance.py).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: receiver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Install nightly Rust toolchain
        run: rustup toolchain install nightly-2026-07-28 --profile minimal

      - name: Build pinned MORK and run native tests
        env:
          MORK_PYTHON: .venv/bin/python
          MORK_TEST_FORK: "1"
          MORK_REQUIRE_NATIVE: "1"
        run: scripts/with-mork.sh --install -- .venv/bin/python -m pytest -q mork/tests src/commit_gate/tests/test_gate_projection.py

      - name: Test configured receiver and crash recovery
        env:
          MORK_PYTHON: .venv/bin/python
          MORK_REQUIRE_NATIVE: "1"
          OMEGACLAW_PRODUCTION_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/receiver_test
        run: scripts/with-mork.sh -- .venv/bin/python -m pytest -q src/omegaclaw/tests/test_production.py
