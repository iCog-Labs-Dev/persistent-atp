name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  coordinator-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test pinned coordinator runtime without model inference
        run: |
          docker run --rm --entrypoint /bin/bash \
            --volume "$PWD:/workspace" --workdir /workspace \
            singularitynet/omega@sha256:a258d30a92b58b8b4bc104605ee57f20b2c2527b2a9ac3532186057098619f3b \
            scripts/coordinator-ci.sh
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      ARTIFACT_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Apply artifact store schema
        run: uv run --locked --extra dev python -c "from artifacts.schema import apply_schema; apply_schema()"
        env:
          ARTIFACT_DB_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Test
        run: uv run --locked --extra dev python -m pytest -q
