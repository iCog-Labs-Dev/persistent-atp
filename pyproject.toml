[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-atp"
version = "0.1.0"
description = "A durable, race-safe metagraph memory system for long-horizon automated theorem proving"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "neo4j>=5.14",
    "psycopg[binary]>=3.3.6",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The production backend is not on PyPI and lives in a private repository,
# so plain pip cannot resolve it — [tool.uv.sources] below applies to uv
# only. Install it with `uv sync --extra real-atp`; everything else
# (including the full test suite) runs without it, against injected fakes.
real-atp = [
    "mathematics-ai-atp",
]

[tool.setuptools]
package-dir = {"" = "src", "mork" = "mork", "persistent_atp_client" = "packages/persistent-atp-client/src/persistent_atp_client"}

[tool.setuptools.packages.find]
where = ["src", ".", "packages/persistent-atp-client/src"]
namespaces = false
include = [
    "alignment*",
    "artifacts*",
    "commit_gate*",
    "context_compiler*",
    "mathproof*",
    "shared*",
    "mork*",
    "persistent_atp_client*",
]

[tool.setuptools.package-data]
persistent_atp_client = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "packages/persistent-atp-client/src"]
# `mork/bench` is deliberately absent: it spawns subprocesses and times them.
testpaths = [
    "src/commit_gate/tests",
    "src/shared/tests",
    "src/mathproof/tests",
    "src/alignment/tests",
    "src/artifacts/tests",
    "src/context_compiler/tests",
    "mork/projector/tests",
    "mork/visualizer/tests",
    "mork/tests",
    "packages/persistent-atp-client/tests",
]

[tool.uv.sources]
mathematics-ai-atp = { git = "https://github.com/iCog-Labs-Dev/Mathematics-ai-atp.git" }
