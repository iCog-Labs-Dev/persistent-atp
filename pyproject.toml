[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-atp"
version = "0.1.0"
description = "A durable, race-safe metagraph memory system for long-horizon automated theorem proving"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "neo4j>=5.14",
    "psycopg[binary]>=3.3.6",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
provider-sdk = [
    "openai>=2.0,<3",
    "PyYAML>=6.0",
]
# The production backend is not on PyPI and lives in a private repository,
# so plain pip cannot resolve it — [tool.uv.sources] below applies to uv
# only. Install it with `uv sync --extra real-atp`; everything else
# (including the full test suite) runs without it, against injected fakes.
real-atp = [
    "mathematics-ai-atp",
]

[project.scripts]
persistent-atp-omega = "omegaclaw.cli:main"
persistent-atp-provider-probe = "omegaclaw.deepseek_probe:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omegaclaw = [
    "config/*.yaml",
    "config/*.conf",
    "omega_plugin/*.metta",
    "omega_plugin/*.txt",
    "omega_plugin/*.py",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/commit_gate/tests", "src/shared/tests", "src/mathproof/tests", "src/alignment/tests", "src/artifacts/tests", "src/omegaclaw/tests", "tests/omegaclaw_runtime"]

[tool.uv.sources]
mathematics-ai-atp = { git = "https://github.com/iCog-Labs-Dev/Mathematics-ai-atp.git" }

