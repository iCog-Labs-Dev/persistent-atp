[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-atp"
version = "0.1.0"
description = "A durable, race-safe metagraph memory system for long-horizon automated theorem proving"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "neo4j>=5.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]
# The production backend is not on PyPI and lives in a private repository,
# so plain pip cannot resolve it — [tool.uv.sources] below applies to uv
# only. Install it with `uv sync --extra real-atp`; everything else
# (including the full test suite) runs without it, against injected fakes.
real-atp = [
    "mathematics-ai-atp",
]

[tool.setuptools]
package-dir = {"" = "src", "mork" = "mork"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["commit_gate*", "mork*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# `mork/bench` is deliberately absent: it spawns subprocesses and times them.
testpaths = [
    "src/commit_gate/tests",
    "src/shared/tests",
    "src/mathproof/tests",
    "src/alignment/tests",
    "mork/projector/tests",
    "mork/visualizer/tests",
    "mork/tests",
]

[tool.uv.sources]
mathematics-ai-atp = { git = "https://github.com/iCog-Labs-Dev/Mathematics-ai-atp.git" }
